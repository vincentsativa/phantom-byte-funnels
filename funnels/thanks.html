<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're In — PhantomByte</title>
    <meta name="robots" content="noindex">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            max-width: 550px;
            padding: 48px 24px;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 24px;
            display: block;
        }
        h1 {
            font-size: 32px;
            color: #9D4EDD;
            margin-bottom: 16px;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
            color: #a0a0b0;
            margin-bottom: 32px;
        }
        .highlight {
            color: #00FF88;
        }
        .btn {
            display: inline-block;
            padding: 14px 36px;
            background: #9D4EDD;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            transition: background 0.2s;
        }
        .btn:hover { background: #b86aff; }
        .email-display {
            margin: 20px 0;
            padding: 12px 20px;
            background: #1a1a2e;
            border-radius: 8px;
            border: 1px solid #2a2a4a;
            display: inline-block;
            font-family: monospace;
            color: #00FF88;
        }
    </style>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PDQCZE09E4"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-PDQCZE09E4');</script>
</head>
<body>
    <div class="container">
        <span class="icon">🎯</span>
        <h1>You're In!</h1>
        <p>Check your inbox for your <span class="highlight">free download</span>.<br>
        If you don't see it in a few minutes, check your spam folder.</p>
        <div class="email-display" id="emailDisplay"></div>
        <p style="font-size:14px;margin-top:24px;color:#606070;">— PhantomByte • Code from the Shadows</p>
        <a href="https://articles.phantom-byte.com" class="btn" style="margin-top:20px;">Explore Articles →</a>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const email = params.get('email');
        if (email) document.getElementById('emailDisplay').textContent = email;
    </script>
</body>
</html>
